<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Player Similarity — NBA 2024/25</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --court:#07080d; --panel:#0f1018; --card:#161820;
      --border:rgba(255,255,255,0.06);
      --orange:#f75c03; --orange-glow:rgba(247,92,3,0.22);
      --gold:#ffd166; --text:#e2e2ee; --muted:#5a5a7a;
      --green:#06d6a0; --red:#ef233c; --blue:#4cc9f0; --purple:#c084fc;
    }
    body {
      background:var(--court); color:var(--text);
      font-family:'DM Sans',sans-serif; min-height:100vh; overflow-x:hidden;
    }
    body::before {
      content:''; position:fixed; inset:0;
      background:
        radial-gradient(ellipse 60% 40% at 50% 0%, rgba(247,92,3,0.06) 0%, transparent 70%),
        repeating-linear-gradient(0deg, transparent, transparent 79px, rgba(255,255,255,0.015) 80px),
        repeating-linear-gradient(90deg, transparent, transparent 79px, rgba(255,255,255,0.015) 80px);
      pointer-events:none; z-index:0;
    }
    nav {
      position:sticky; top:0; z-index:100;
      background:rgba(7,8,13,0.85); backdrop-filter:blur(16px);
      border-bottom:1px solid var(--border);
      padding:0 32px; display:flex; align-items:center; gap:32px; height:60px;
    }
    .nav-brand {
      font-family:'Bebas Neue',sans-serif; font-size:1.4rem; letter-spacing:3px;
      background:linear-gradient(135deg,#fff,var(--gold));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
      text-decoration:none;
    }
    .nav-links { display:flex; gap:4px; margin-left:auto; }
    .nav-link {
      padding:6px 14px; border-radius:8px; font-size:0.85rem;
      color:var(--muted); text-decoration:none; transition:color 0.2s,background 0.2s;
    }
    .nav-link:hover  { color:var(--text); background:rgba(255,255,255,0.05); }
    .nav-link.active { color:var(--orange); background:rgba(247,92,3,0.1); }

    .wrapper { position:relative; z-index:1; max-width:960px; margin:0 auto; padding:40px 24px 80px; }

    header { text-align:center; margin-bottom:36px; animation:fadeDown 0.6s ease both; }
    .logo-row { display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:8px; }
    .ball-icon {
      width:44px; height:44px; background:var(--orange); border-radius:50%;
      position:relative; box-shadow:0 0 24px var(--orange-glow); flex-shrink:0;
    }
    .ball-icon::before { content:''; position:absolute; inset:6px; border:2px solid rgba(0,0,0,0.35); border-radius:50%; }
    .ball-icon::after  { content:''; position:absolute; top:50%; left:-4px; right:-4px; height:2px; background:rgba(0,0,0,0.3); transform:translateY(-50%); }
    h1 {
      font-family:'Bebas Neue',sans-serif; font-size:clamp(2.4rem,6vw,3.8rem); letter-spacing:3px; line-height:1;
      background:linear-gradient(135deg,#fff 30%,var(--gold));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    }
    .subtitle { color:var(--muted); font-size:0.92rem; letter-spacing:2px; text-transform:uppercase; margin-top:6px; }

    .search-card {
      background:var(--panel); border:1px solid var(--border);
      border-radius:20px; padding:32px; margin-bottom:24px;
      animation:fadeUp 0.5s 0.1s ease both;
    }
    .section-title {
      font-family:'Bebas Neue',sans-serif; font-size:1.1rem; letter-spacing:2px;
      color:var(--orange); margin-bottom:20px; padding-bottom:12px; border-bottom:1px solid var(--border);
    }
    .search-row { display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap; }
    .autocomplete-wrap { position:relative; flex:1; min-width:240px; }
    input[type="text"] {
      background:var(--card); border:1px solid var(--border); border-radius:10px;
      color:var(--text); font-family:'DM Sans',sans-serif; font-size:0.95rem;
      padding:11px 14px; transition:border-color 0.2s,box-shadow 0.2s; width:100%; outline:none;
    }
    input[type="text"]:focus { border-color:var(--orange); box-shadow:0 0 0 3px var(--orange-glow); }
    input::placeholder { color:var(--muted); }
    .autocomplete-list {
      display:none; position:absolute; top:calc(100% + 6px); left:0; right:0;
      background:var(--card); border:1px solid rgba(247,92,3,0.2); border-radius:10px;
      max-height:220px; overflow-y:auto; z-index:9999; box-shadow:0 12px 40px rgba(0,0,0,0.5);
    }
    .autocomplete-list.open { display:block; }
    .autocomplete-item {
      padding:10px 14px; cursor:pointer; font-size:0.9rem;
      border-bottom:1px solid var(--border); transition:background 0.1s,color 0.1s;
    }
    .autocomplete-item:last-child { border-bottom:none; }
    .autocomplete-item:hover { background:rgba(247,92,3,0.08); color:var(--orange); }

    .n-select {
      background:var(--card); border:1px solid var(--border); border-radius:10px;
      color:var(--text); font-family:'DM Sans',sans-serif; font-size:0.9rem;
      padding:11px 14px; outline:none; cursor:pointer; transition:border-color 0.2s;
    }
    .n-select:focus { border-color:var(--orange); }
    .btn-search {
      padding:11px 28px; border-radius:12px; background:var(--orange); border:none; color:#fff;
      font-family:'Bebas Neue',sans-serif; font-size:1.1rem; letter-spacing:3px;
      cursor:pointer; transition:transform 0.15s,box-shadow 0.2s;
      box-shadow:0 4px 20px var(--orange-glow); white-space:nowrap;
    }
    .btn-search:hover { transform:translateY(-2px); box-shadow:0 8px 28px rgba(247,92,3,0.45); }
    .btn-search:active { transform:translateY(0); }
    .btn-search:disabled { background:#222; box-shadow:none; cursor:not-allowed; transform:none; }
    .error-box {
      margin-top:14px; padding:11px 16px; border-radius:10px;
      background:rgba(239,35,60,0.08); border:1px solid rgba(239,35,60,0.2);
      color:var(--red); font-size:0.87rem; display:none;
    }
    .error-box.visible { display:block; }

    .results-wrap { animation:fadeUp 0.5s 0.15s ease both; }

    .query-banner {
      background:rgba(247,92,3,0.06); border:1px solid rgba(247,92,3,0.18);
      border-radius:16px; padding:18px 22px;
      display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:20px;
    }
    .query-avatar {
      width:48px; height:48px; border-radius:50%; background:var(--orange);
      display:flex; align-items:center; justify-content:center;
      font-family:'Bebas Neue',sans-serif; font-size:15px; letter-spacing:1px;
      color:#fff; flex-shrink:0; box-shadow:0 0 18px var(--orange-glow);
    }
    .query-info h2 { font-family:'Bebas Neue',sans-serif; font-size:1.2rem; letter-spacing:2px; color:#fff; }
    .query-info p  { color:var(--muted); font-size:0.8rem; margin-top:3px; }
    .query-stats { display:flex; gap:20px; margin-left:auto; flex-wrap:wrap; }
    .q-stat .val { font-family:'Bebas Neue',sans-serif; font-size:1.3rem; letter-spacing:1px; color:var(--gold); }
    .q-stat .lbl { font-size:0.62rem; letter-spacing:1.5px; color:var(--muted); text-transform:uppercase; margin-top:1px; }

    .sim-list { display:flex; flex-direction:column; gap:10px; }
    .sim-card {
      background:var(--panel); border:1px solid var(--border); border-radius:14px;
      padding:16px 20px;
      display:grid; grid-template-columns:32px 42px 1fr auto;
      align-items:center; gap:14px;
      transition:border-color 0.2s,background 0.2s;
      opacity:0; animation:slideIn 0.35s ease forwards;
    }
    .sim-card:hover { border-color:rgba(247,92,3,0.25); background:rgba(247,92,3,0.03); }
    .rank { font-family:'Bebas Neue',sans-serif; font-size:1rem; letter-spacing:1px; color:var(--muted); text-align:center; }
    .sim-avatar {
      width:38px; height:38px; border-radius:50%; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      font-family:'Bebas Neue',sans-serif; font-size:12px; color:#fff;
    }
    .av-0{background:linear-gradient(135deg,#f75c03,#ffd166)}
    .av-1{background:linear-gradient(135deg,#4cc9f0,#2d6a8a)}
    .av-2{background:linear-gradient(135deg,#06d6a0,#028a60)}
    .av-3{background:linear-gradient(135deg,#c084fc,#7c3aed)}
    .av-4{background:linear-gradient(135deg,#ffd166,#f75c03)}
    .av-5{background:linear-gradient(135deg,#ef233c,#c20c21)}
    .av-6{background:linear-gradient(135deg,#4cc9f0,#06d6a0)}
    .av-7{background:linear-gradient(135deg,#ffd166,#c084fc)}
    .av-8{background:linear-gradient(135deg,#f75c03,#c084fc)}
    .av-9{background:linear-gradient(135deg,#06d6a0,#ffd166)}
    .sim-body { min-width:0; }
    .sim-body h3 { font-size:0.95rem; font-weight:600; color:var(--text); }
    .sim-meta { display:flex; align-items:center; gap:8px; margin-top:4px; flex-wrap:wrap; }
    .sim-stats-row { display:flex; gap:14px; margin-top:6px; flex-wrap:wrap; }
    .s-stat .v { font-size:0.85rem; font-weight:600; color:var(--text); }
    .s-stat .l { font-size:0.6rem; letter-spacing:1px; color:var(--muted); text-transform:uppercase; }
    .sim-right { display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
    .sim-pct { font-family:'Bebas Neue',sans-serif; font-size:1.3rem; letter-spacing:1px; color:var(--orange); }
    .bar-wrap { width:100px; height:3px; background:var(--border); border-radius:2px; overflow:hidden; }
    .bar-fill {
      height:100%; border-radius:2px; width:0;
      background:linear-gradient(90deg,var(--orange),var(--gold));
      transition:width 0.8s cubic-bezier(0.4,0,0.2,1);
    }
    .btn-predict-sm {
      padding:5px 11px; border-radius:7px; cursor:pointer;
      background:rgba(247,92,3,0.1); border:1px solid rgba(247,92,3,0.22);
      color:var(--orange); font-size:0.75rem; font-family:'DM Sans',sans-serif;
      font-weight:600; transition:background 0.15s; white-space:nowrap;
    }
    .btn-predict-sm:hover { background:var(--orange); color:#fff; border-color:var(--orange); }
    .pos-tag { display:inline-flex; align-items:center; justify-content:center; padding:2px 8px; border-radius:5px; font-size:0.68rem; letter-spacing:1px; font-weight:700; }
    .pos-PG{background:rgba(76,201,240,0.1);color:var(--blue);border:1px solid rgba(76,201,240,0.2)}
    .pos-SG{background:rgba(247,92,3,0.1);color:var(--orange);border:1px solid rgba(247,92,3,0.2)}
    .pos-SF{background:rgba(6,214,160,0.1);color:var(--green);border:1px solid rgba(6,214,160,0.2)}
    .pos-PF{background:rgba(255,209,102,0.1);color:var(--gold);border:1px solid rgba(255,209,102,0.2)}
    .pos-C {background:rgba(192,132,252,0.1);color:var(--purple);border:1px solid rgba(192,132,252,0.2)}

    .state-box { text-align:center; padding:70px 20px; color:var(--muted); }
    .empty-ball {
      width:60px; height:60px; border-radius:50%; background:var(--card);
      border:2px solid var(--border); margin:0 auto 20px;
      display:flex; align-items:center; justify-content:center; font-size:26px; opacity:0.4;
    }
    .state-box p { font-size:0.9rem; line-height:1.7; }
    .spinner {
      width:36px; height:36px; margin:0 auto 16px;
      border:2px solid var(--border); border-top-color:var(--orange);
      border-radius:50%; animation:spin 0.7s linear infinite;
    }
    .hidden { display:none !important; }
    @keyframes fadeDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeUp  {from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)}}
    @keyframes slideIn {from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
    @keyframes spin    {to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<nav>
  <a href="/" class="nav-brand">🏀 NBA Predictor</a>
  <div class="nav-links">
    <a href="/"         class="nav-link">Predict</a>
    <a href="/teams/"   class="nav-link">Teams</a>
    <a href="/similar/" class="nav-link active">Similarity</a>
    <a href="/login/" class="nav-link" style="color:var(--gold);border:1px solid rgba(255,209,102,0.2);margin-left:8px">⚡ Login</a>
  </div>
</nav>
<div class="wrapper">
  <header>
    <div class="logo-row"><div class="ball-icon"></div><h1>PLAYER SIMILARITY</h1></div>
    <p class="subtitle">Machine Learning · Cosine Similarity · KNN</p>
  </header>
  <div class="search-card">
    <div class="section-title">SEARCH PLAYER</div>
    <div class="search-row">
      <div class="autocomplete-wrap">
        <input type="text" id="player-input" placeholder="e.g. Stephen Curry, LeBron James…" autocomplete="off"/>
        <div class="autocomplete-list" id="autocomplete-list"></div>
      </div>
      <select class="n-select" id="n-select">
        <option value="5">Top 5</option>
        <option value="8">Top 8</option>
        <option value="10">Top 10</option>
      </select>
      <button class="btn-search" id="search-btn" onclick="doSearch()">FIND SIMILAR</button>
    </div>
    <div class="error-box" id="error-box"></div>
  </div>
  <div class="results-wrap">
    <div class="state-box" id="empty-state">
      <div class="empty-ball">🎯</div>
      <p>Enter a player name above to find their<br>most statistically similar NBA counterparts.</p>
    </div>
    <div class="state-box hidden" id="loading-state">
      <div class="spinner"></div>
      <p>Scanning player profiles…</p>
    </div>
    <div class="hidden" id="results-container">
      <div class="query-banner" id="query-banner"></div>
      <div class="sim-list" id="sim-list"></div>
    </div>
  </div>
</div>
<script>
const API='http://127.0.0.1:8000';
let allPlayers=[];
async function loadPlayers(){
  try{const r=await fetch(`${API}/api/players/`);const d=await r.json();allPlayers=d.players||[];}
  catch(e){console.warn('Players load failed:',e.message);}
}
const input=document.getElementById('player-input');
const dropdown=document.getElementById('autocomplete-list');
input.addEventListener('input',()=>{
  const q=input.value.trim();
  if(!q||q.length<2){dropdown.classList.remove('open');return;}
  const norm=q.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\./g,'');
  const matches=allPlayers.filter(n=>{
    const nn=n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\./g,'');
    return nn.includes(norm);
  }).slice(0,15);
  if(!matches.length){dropdown.classList.remove('open');return;}
  dropdown.innerHTML=matches.map(name=>`<div class="autocomplete-item" onclick="selectPlayer('${name.replace(/'/g,"\\'")}')">${name}</div>`).join('');
  dropdown.classList.add('open');
});
function selectPlayer(name){input.value=name;dropdown.classList.remove('open');doSearch();}
document.addEventListener('click',e=>{if(!e.target.closest('.autocomplete-wrap'))dropdown.classList.remove('open');});
input.addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});

async function doSearch(){
  const name=input.value.trim();
  const n=document.getElementById('n-select').value;
  const errBox=document.getElementById('error-box');
  errBox.classList.remove('visible');
  if(!name){errBox.textContent='Please enter a player name.';errBox.classList.add('visible');return;}
  document.getElementById('empty-state').classList.add('hidden');
  document.getElementById('results-container').classList.add('hidden');
  document.getElementById('loading-state').classList.remove('hidden');
  document.getElementById('search-btn').disabled=true;
  try{
    const res=await fetch(`${API}/api/similar/${encodeURIComponent(name)}/?n=${n}`);
    const data=await res.json();
    if(!res.ok)throw new Error(data.error||'Player not found');
    document.getElementById('loading-state').classList.add('hidden');
    renderResults(data);
  }catch(e){
    document.getElementById('loading-state').classList.add('hidden');
    document.getElementById('empty-state').classList.remove('hidden');
    errBox.textContent='⚠️ '+e.message;errBox.classList.add('visible');
  }finally{document.getElementById('search-btn').disabled=false;}
}

function initials(n){return n.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();}
function posTag(pos){
  if(!pos)return'';
  const cls=['PG','SG','SF','PF','C'].includes(pos)?`pos-${pos}`:'';
  return`<span class="pos-tag ${cls}">${pos}</span>`;
}
function fmt(v,pct){if(v==null)return'—';return pct?(v*100).toFixed(1)+'%':v;}

function renderResults(data){
  const q=data.query;
  document.getElementById('query-banner').innerHTML=`
    <div class="query-avatar">${initials(q.name)}</div>
    <div class="query-info">
      <h2>${q.name}</h2>
      <p>${posTag(q.Pos)}${q.Pos?' · ':''}${data.total} similar players found</p>
    </div>
    <div class="query-stats">
      <div class="q-stat"><div class="val">${q.PTS??'—'}</div><div class="lbl">PTS</div></div>
      <div class="q-stat"><div class="val">${q.AST??'—'}</div><div class="lbl">AST</div></div>
    </div>`;
  document.getElementById('sim-list').innerHTML=data.similar.map((p,i)=>`
    <div class="sim-card" style="animation-delay:${i*0.055}s">
      <div class="rank">#${i+1}</div>
      <div class="sim-avatar av-${i%10}">${initials(p.name)}</div>
      <div class="sim-body">
        <h3>${p.name}</h3>
        <div class="sim-meta">${posTag(p.Pos)}${p.Age?`<span style="color:var(--muted);font-size:0.75rem">Age ${p.Age}</span>`:''}</div>
        <div class="sim-stats-row">
          <div class="s-stat"><div class="v">${fmt(p.PTS)}</div><div class="l">PTS</div></div>
          <div class="s-stat"><div class="v">${fmt(p.AST)}</div><div class="l">AST</div></div>
          <div class="s-stat"><div class="v">${fmt(p.TRB)}</div><div class="l">REB</div></div>
          <div class="s-stat"><div class="v">${fmt(p['FG%'],true)}</div><div class="l">FG%</div></div>
          <div class="s-stat"><div class="v">${fmt(p['3P%'],true)}</div><div class="l">3P%</div></div>
          <div class="s-stat"><div class="v">${fmt(p.MP)}</div><div class="l">MP</div></div>
        </div>
      </div>
      <div class="sim-right">
        <div class="sim-pct">${p.similarity}%</div>
        <div class="bar-wrap"><div class="bar-fill" data-w="${p.similarity}"></div></div>
        {% comment %} <button class="btn-predict-sm" onclick="goPredict('${p.name.replace(/'/g,"\\'")}',${JSON.stringify(p)})">⚡ Predict</button> {% endcomment %}
      </div>
    </div>`).join('');
  document.getElementById('results-container').classList.remove('hidden');
  setTimeout(()=>{document.querySelectorAll('.bar-fill').forEach(b=>{b.style.width=b.dataset.w+'%';});},80);
}
function goPredict(name,stats){
  const p=new URLSearchParams({player_name:name,AST:stats.AST??'',STL:stats.STL??'',BLK:stats.BLK??'',
    FGP:stats['FG%']??'',TPP:stats['3P%']??'',FTP:stats['FT%']??'',MP:stats.MP??'',TOV:stats.TOV??''});
  window.location.href=`/?${p.toString()}`;
}
loadPlayers().then(()=>{
  const q=new URLSearchParams(window.location.search).get('q');
  if(q){input.value=q;doSearch();}
});
</script>
</body>
</html>
