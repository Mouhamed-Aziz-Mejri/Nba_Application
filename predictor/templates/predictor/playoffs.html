<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Playoff Simulator — NBA 2024/25</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --court:#07080d;--panel:#0f1018;--card:#161820;--border:rgba(255,255,255,0.06);
      --orange:#f75c03;--glow:rgba(247,92,3,0.22);--gold:#ffd166;
      --text:#e2e2ee;--muted:#5a5a7a;--green:#06d6a0;--red:#ef233c;
      --blue:#4cc9f0;--purple:#c084fc;
    }
    body{background:var(--court);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden;}
    body::before{
      content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
      background:
        radial-gradient(ellipse 70% 40% at 50% 0%,rgba(247,92,3,0.07) 0%,transparent 65%),
        repeating-linear-gradient(0deg,transparent,transparent 79px,rgba(255,255,255,0.012) 80px),
        repeating-linear-gradient(90deg,transparent,transparent 79px,rgba(255,255,255,0.012) 80px);
    }

    nav{
      position:sticky;top:0;z-index:100;
      background:rgba(7,8,13,0.9);backdrop-filter:blur(16px);
      border-bottom:1px solid var(--border);
      padding:0 28px;display:flex;align-items:center;gap:24px;height:60px;
    }
    .nav-brand{
      font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:3px;
      background:linear-gradient(135deg,#fff,var(--gold));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none;
    }
    .nav-links{display:flex;gap:4px;margin-left:auto;}
    .nav-link{padding:6px 14px;border-radius:8px;font-size:0.85rem;color:var(--muted);text-decoration:none;transition:color .2s,background .2s;}
    .nav-link:hover{color:var(--text);background:rgba(255,255,255,0.05);}
    .nav-link.active{color:var(--orange);background:rgba(247,92,3,0.1);}

    .wrapper{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:36px 20px 80px;}

    /* ── Header ── */
    header{text-align:center;margin-bottom:32px;animation:fadeDown .5s ease both;}
    .logo-row{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:8px;}
    .ball-icon{width:44px;height:44px;background:var(--orange);border-radius:50%;position:relative;box-shadow:0 0 24px var(--glow);}
    .ball-icon::before{content:'';position:absolute;inset:6px;border:2px solid rgba(0,0,0,0.35);border-radius:50%;}
    .ball-icon::after{content:'';position:absolute;top:50%;left:-4px;right:-4px;height:2px;background:rgba(0,0,0,0.3);transform:translateY(-50%);}
    h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(2.2rem,5vw,3.4rem);letter-spacing:4px;
      background:linear-gradient(135deg,#fff 30%,var(--gold));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .subtitle{color:var(--muted);font-size:0.85rem;letter-spacing:2px;text-transform:uppercase;margin-top:6px;}

    /* ── Model pills ── */
    .model-strip{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:28px;}
    .m-pill{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 14px;display:flex;flex-direction:column;align-items:center;gap:2px;}
    .m-pill .lbl{font-size:0.62rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);}
    .m-pill .val{font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:1px;color:var(--orange);}

    /* ── Round progress indicator ── */
    .round-progress{
      display:flex;align-items:center;justify-content:center;gap:0;
      margin-bottom:32px;
    }
    .rp-step{
      display:flex;flex-direction:column;align-items:center;gap:6px;
      position:relative;
    }
    .rp-dot{
      width:36px;height:36px;border-radius:50%;
      background:var(--card);border:2px solid var(--border);
      display:flex;align-items:center;justify-content:center;
      font-family:'Bebas Neue',sans-serif;font-size:0.75rem;letter-spacing:1px;
      color:var(--muted);transition:all .4s ease;cursor:default;
    }
    .rp-dot.done{background:rgba(6,214,160,0.1);border-color:var(--green);color:var(--green);}
    .rp-dot.active{background:rgba(247,92,3,0.15);border-color:var(--orange);color:var(--orange);
      box-shadow:0 0 16px rgba(247,92,3,0.3);}
    .rp-label{font-size:0.62rem;letter-spacing:1px;text-transform:uppercase;color:var(--muted);text-align:center;max-width:64px;}
    .rp-label.active{color:var(--orange);}
    .rp-label.done{color:var(--green);}
    .rp-line{width:48px;height:2px;background:var(--border);margin-bottom:18px;transition:background .4s;}
    .rp-line.done{background:var(--green);}

    /* ── Action button ── */
    .action-wrap{text-align:center;margin-bottom:32px;}
    .btn-simulate{
      padding:14px 36px;border-radius:14px;background:var(--orange);border:none;color:#fff;
      font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:4px;
      cursor:pointer;transition:transform .15s,box-shadow .2s;
      box-shadow:0 6px 28px var(--glow);display:inline-flex;align-items:center;gap:12px;
    }
    .btn-simulate:hover{transform:translateY(-3px);box-shadow:0 12px 36px rgba(247,92,3,0.5);}
    .btn-simulate:active{transform:translateY(0);}
    .btn-simulate:disabled{background:#1a1a2e;color:var(--muted);box-shadow:none;cursor:not-allowed;transform:none;}
    .btn-simulate .spinner{
      display:none;width:20px;height:20px;
      border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;
      border-radius:50%;animation:spin .7s linear infinite;
    }
    .btn-simulate.loading .btn-txt{display:none;}
    .btn-simulate.loading .spinner{display:block;}
    .btn-reset{
      margin-left:12px;padding:14px 20px;border-radius:14px;
      background:var(--card);border:1px solid var(--border);color:var(--muted);
      font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:2px;
      cursor:pointer;transition:all .2s;display:none;
    }
    .btn-reset:hover{border-color:rgba(255,255,255,0.2);color:var(--text);}

    /* ── Bracket canvas ── */
    .bracket-area{margin-bottom:36px;}

    /* Conference section */
    .conf-wrap{
      background:var(--panel);border:1px solid var(--border);border-radius:18px;
      padding:24px;margin-bottom:16px;
    }
    .conf-header{
      display:flex;align-items:center;gap:12px;margin-bottom:20px;
    }
    .conf-badge{
      font-family:'Bebas Neue',sans-serif;font-size:0.8rem;letter-spacing:3px;
      padding:5px 12px;border-radius:8px;background:rgba(247,92,3,0.1);
      border:1px solid rgba(247,92,3,0.2);color:var(--orange);
    }
    .conf-name{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:3px;color:#fff;}
    .conf-champ-badge{
      margin-left:auto;font-family:'Bebas Neue',sans-serif;font-size:0.75rem;letter-spacing:2px;
      padding:4px 12px;border-radius:6px;display:none;
    }
    .conf-champ-badge.visible{display:block;}

    /* Rounds row */
    .rounds-row{
      display:grid;gap:12px;
      grid-template-columns:repeat(4,1fr);
      align-items:start;
    }
    .round-col{}
    .round-hdr{
      font-family:'Bebas Neue',sans-serif;font-size:0.72rem;letter-spacing:2.5px;
      color:var(--muted);text-align:center;margin-bottom:10px;padding-bottom:8px;
      border-bottom:1px solid var(--border);
    }
    .round-hdr.active{color:var(--orange);border-color:rgba(247,92,3,0.2);}
    .round-hdr.done{color:var(--green);border-color:rgba(6,214,160,0.2);}
    .series-slot{min-height:90px;display:flex;flex-direction:column;gap:8px;}

    /* Series card */
    .series-card{
      background:var(--card);border:1px solid var(--border);border-radius:12px;
      overflow:hidden;opacity:0;transform:translateY(8px);
      transition:border-color .2s,box-shadow .2s;
    }
    .series-card.revealed{opacity:1;transform:translateY(0);}
    .series-card.upset-card{border-color:rgba(192,132,252,0.25);}
    .team-row{
      display:flex;align-items:center;gap:8px;padding:8px 10px;
      border-bottom:1px solid var(--border);
    }
    .team-row:last-of-type{border-bottom:none;}
    .team-row.winner-row{background:rgba(247,92,3,0.07);}
    .seed-n{
      font-family:'Bebas Neue',sans-serif;font-size:0.7rem;color:var(--muted);
      width:14px;text-align:center;flex-shrink:0;
    }
    .t-logo{
      width:24px;height:24px;border-radius:50%;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;
      font-family:'Bebas Neue',sans-serif;font-size:7px;color:#fff;letter-spacing:0;
    }
    .t-name{font-size:0.78rem;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .t-name.bold{font-weight:600;color:#fff;}
    .w-tag{
      font-family:'Bebas Neue',sans-serif;font-size:0.62rem;letter-spacing:1px;
      padding:2px 6px;border-radius:4px;flex-shrink:0;
    }
    .w-tag.win{background:rgba(247,92,3,0.15);color:var(--orange);}
    .w-tag.lose{color:transparent;}

    .card-footer{
      padding:5px 10px 6px;background:rgba(0,0,0,0.25);
      display:flex;align-items:center;gap:6px;
    }
    .bar-outer{flex:1;height:3px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden;}
    .bar-inner{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--orange),var(--gold));width:0;transition:width .9s cubic-bezier(.4,0,.2,1);}
    .pct-lbl{font-size:0.65rem;color:var(--orange);font-weight:600;white-space:nowrap;}
    .upset-lbl{font-size:0.6rem;color:var(--purple);letter-spacing:1px;margin-left:auto;}
    .games-lbl{font-size:0.62rem;color:var(--muted);}

    /* Placeholder slot */
    .slot-tbd{
      background:var(--card);border:1px dashed rgba(255,255,255,0.06);
      border-radius:12px;height:82px;
      display:flex;align-items:center;justify-content:center;
      font-size:0.72rem;color:var(--muted);letter-spacing:1px;
    }

    /* ── Finals ── */
    .finals-section{
      background:linear-gradient(135deg,rgba(247,92,3,0.06),rgba(255,209,102,0.03));
      border:1px solid rgba(247,92,3,0.2);border-radius:18px;
      padding:28px;margin-bottom:32px;
      opacity:0;transform:translateY(12px);transition:opacity .5s,transform .5s;
    }
    .finals-section.revealed{opacity:1;transform:translateY(0);}
    .finals-title{
      font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:5px;
      color:var(--gold);text-align:center;margin-bottom:20px;
    }
    .finals-matchup{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;}
    .finals-team{
      display:flex;flex-direction:column;align-items:center;gap:10px;
      padding:18px 28px;border-radius:14px;
      background:var(--panel);border:1px solid var(--border);min-width:150px;
      transition:all .4s ease;
    }
    .finals-team.champion{
      background:rgba(247,92,3,0.08);border-color:rgba(247,92,3,0.35);
      box-shadow:0 0 32px rgba(247,92,3,0.12);
    }
    .finals-logo{
      width:56px;height:56px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-family:'Bebas Neue',sans-serif;font-size:13px;color:#fff;
    }
    .finals-name{font-family:'Bebas Neue',sans-serif;font-size:0.95rem;letter-spacing:2px;text-align:center;}
    .finals-seed{font-size:0.72rem;color:var(--muted);}
    .champ-crown{font-size:22px;animation:bounce .6s ease both;}
    .vs-badge{font-family:'Bebas Neue',sans-serif;font-size:2.2rem;letter-spacing:4px;color:var(--muted);}
    .finals-prob-row{text-align:center;margin-top:16px;font-size:0.84rem;color:var(--muted);}
    .finals-prob-row span{color:var(--orange);font-family:'Bebas Neue',sans-serif;font-size:1.1rem;}

    /* ── Champion reveal ── */
    .champion-section{
      text-align:center;padding:36px 20px;margin-bottom:32px;
      background:linear-gradient(135deg,rgba(255,209,102,0.05),rgba(247,92,3,0.04));
      border:1px solid rgba(255,209,102,0.15);border-radius:20px;
      opacity:0;transform:scale(0.95);transition:opacity .6s,transform .6s;
    }
    .champion-section.revealed{opacity:1;transform:scale(1);}
    .champ-emoji{font-size:64px;display:block;margin-bottom:16px;animation:bounce .8s ease both;}
    .champ-name{
      font-family:'Bebas Neue',sans-serif;font-size:clamp(2.4rem,6vw,4rem);
      letter-spacing:5px;line-height:1;
      background:linear-gradient(135deg,var(--gold),var(--orange));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    }
    .champ-sub{color:var(--muted);font-size:0.88rem;letter-spacing:2px;text-transform:uppercase;margin-top:8px;}
    .champ-prob-badge{
      display:inline-block;margin-top:14px;padding:9px 22px;
      background:rgba(247,92,3,0.1);border:1px solid rgba(247,92,3,0.25);
      border-radius:10px;font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:2px;color:var(--orange);
    }
    .correct-stamp{
      display:inline-flex;align-items:center;gap:8px;margin-top:12px;
      padding:8px 18px;border-radius:10px;
      background:rgba(6,214,160,0.08);border:1px solid rgba(6,214,160,0.2);
      color:var(--green);font-family:'Bebas Neue',sans-serif;font-size:0.85rem;letter-spacing:2px;
    }

    /* ── Confetti ── */
    .confetti-piece{
      position:fixed;width:10px;height:10px;border-radius:2px;
      pointer-events:none;z-index:999;
      animation:confettiFall linear forwards;
    }
    @keyframes confettiFall{
      0%{transform:translateY(-20px) rotate(0deg);opacity:1;}
      100%{transform:translateY(100vh) rotate(720deg);opacity:0;}
    }

    /* ── Loading ── */
    .init-loading{text-align:center;padding:80px 20px;color:var(--muted);}
    .spinner-lg{width:44px;height:44px;margin:0 auto 20px;border:3px solid var(--border);border-top-color:var(--orange);border-radius:50%;animation:spin .7s linear infinite;}
    .hidden{display:none!important;}

    @keyframes fadeDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeUp  {from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)}}
    @keyframes spin    {to{transform:rotate(360deg)}}
    @keyframes bounce  {0%{transform:scale(0.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
  </style>
</head>
<body>

<nav>
  <a href="/" class="nav-brand">🏀 NBA Predictor</a>
  <div class="nav-links">
    <a href="/" class="nav-link">Predict</a>
    <a href="/teams/" class="nav-link">Teams</a>
    <a href="/similar/" class="nav-link">Similarity</a>
    <a href="/playoffs/" class="nav-link active">Playoffs</a>
    <a href="/fantasy/" class="nav-link">Fantasy</a>
  </div>
</nav>

<div class="wrapper">

  <header>
    <div class="logo-row"><div class="ball-icon"></div><h1>PLAYOFF SIMULATOR</h1></div>
    <p class="subtitle">2024–25 Season · XGBoost · Click to reveal each round</p>
  </header>

  <!-- Init loading -->
  <div class="init-loading" id="init-loading">
    <div class="spinner-lg"></div>
    <p>Loading simulation data…</p>
  </div>

  <div class="hidden" id="sim-ui">

    <!-- Model pills -->
    <div class="model-strip" id="model-strip"></div>

    <!-- Round progress steps -->
    <div class="round-progress" id="round-progress"></div>

    <!-- Action button -->
    <div class="action-wrap">
      <button class="btn-simulate" id="btn-sim" onclick="nextRound()">
        <span class="btn-txt" id="btn-txt">▶ SIMULATE ROUND 1</span>
        <div class="spinner"></div>
      </button>
      <button class="btn-reset" id="btn-reset" onclick="resetSim()">↺ RESET</button>
    </div>

    <!-- Bracket area -->
    <div class="bracket-area" id="bracket-area"></div>

    <!-- Finals -->
    <div class="finals-section hidden" id="finals-section"></div>

    <!-- Champion -->
    <div class="champion-section hidden" id="champion-section"></div>

  </div>
</div>

<script>
const API = 'http://127.0.0.1:8000';

const TEAM_COLORS = {
  BOS:'#007A33',CLE:'#860038',NYK:'#006BB6',IND:'#002D62',
  MIL:'#00471B',ORL:'#0077C0',MIA:'#98002E',CHI:'#CE1141',
  OKC:'#007AC1',HOU:'#CE1141',LAC:'#C8102E',DEN:'#0E2240',
  GSW:'#1D428A',LAL:'#552583',MIN:'#0C2340',MEM:'#5D76A9',
};

const ROUND_LABELS = ['R1','R2','CF','Finals'];
const ROUND_NAMES  = ['First Round','Semifinals','Conf. Final','NBA Finals'];
const BTN_LABELS   = [
  '▶ SIMULATE ROUND 1',
  '▶ SIMULATE SEMIFINALS',
  '▶ SIMULATE CONF. FINALS',
  '🏆 SIMULATE NBA FINALS',
];

let simData  = null;
let teamsMap = null;
let currentRound = 0; // 0=nothing done yet, 1=R1 done, etc.

// ── Load ──────────────────────────────────────────────────────────────────────
async function load() {
  try {
    const res  = await fetch(`${API}/api/playoff/simulate/`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed');
    simData  = data.simulation;
    teamsMap = data.teams;
    initUI(data);
    document.getElementById('init-loading').classList.add('hidden');
    document.getElementById('sim-ui').classList.remove('hidden');
  } catch(e) {
    document.getElementById('init-loading').innerHTML =
      `<div style="color:var(--red);padding:40px;">⚠️ ${e.message}<br><small>Is the server running?</small></div>`;
  }
}

// ── Init UI ───────────────────────────────────────────────────────────────────
function initUI(data) {
  const info = data.model_info;

  // Model pills
  document.getElementById('model-strip').innerHTML = [
    {l:'Algorithm', v:'XGBoost', c:'var(--gold)'},
    {l:'CV Accuracy', v:info.cv_accuracy+'%', c:'var(--orange)'},
    {l:'AUC-ROC', v:info.cv_auc, c:'var(--orange)'},
    {l:'Training Series', v:info.training_series, c:'var(--orange)'},
    {l:'Features', v:info.features.length, c:'var(--orange)'},
  ].map(p=>`<div class="m-pill"><span class="lbl">${p.l}</span><span class="val" style="color:${p.c}">${p.v}</span></div>`).join('');

  // Progress steps
  document.getElementById('round-progress').innerHTML = ROUND_LABELS.map((lbl,i)=>`
    ${i>0?'<div class="rp-line" id="line-'+i+'"></div>':''}
    <div class="rp-step">
      <div class="rp-dot" id="dot-${i}">${lbl}</div>
      <div class="rp-label" id="dlbl-${i}">${ROUND_NAMES[i]}</div>
    </div>`).join('');

  // Activate first dot
  document.getElementById('dot-0').classList.add('active');
  document.getElementById('dlbl-0').classList.add('active');

  // Build empty bracket shell
  buildBracketShell();
}

// ── Build bracket shell with TBD slots ───────────────────────────────────────
function buildBracketShell() {
  const area = document.getElementById('bracket-area');
  area.innerHTML = ['East','West'].map(conf => `
    <div class="conf-wrap" id="conf-${conf}">
      <div class="conf-header">
        <span class="conf-badge">${conf.toUpperCase()}</span>
        <span class="conf-name">${conf}ern Conference</span>
        <span class="conf-champ-badge" id="confchamp-${conf}"></span>
      </div>
      <div class="rounds-row">
        ${['First Round','Semifinals','Conf. Final','Champ'].map((rn,ri)=>`
          <div class="round-col">
            <div class="round-hdr" id="rhdr-${conf}-${ri}">${rn}</div>
            <div class="series-slot" id="slot-${conf}-${ri}">
              ${ri===0
                ? simData[conf].R1.map((_,si)=>`<div class="slot-tbd" id="card-${conf}-0-${si}">TBD</div>`).join('')
                : ri===1
                  ? simData[conf].R2.map((_,si)=>`<div class="slot-tbd" id="card-${conf}-1-${si}">TBD</div>`).join('')
                  : ri===2
                    ? `<div class="slot-tbd" id="card-${conf}-2-0">TBD</div>`
                    : `<div class="slot-tbd" id="card-${conf}-3-0">TBD</div>`
              }
            </div>
          </div>`).join('')}
      </div>
    </div>`).join('');
}

// ── Logo ──────────────────────────────────────────────────────────────────────
function logo(code, size=24) {
  return `<div class="t-logo" style="width:${size}px;height:${size}px;background:${TEAM_COLORS[code]||'#333'}">${code}</div>`;
}

// ── Render a series card ──────────────────────────────────────────────────────
function seriesHTML(s) {
  const hw = s.winner === s.home;
  return `
    <div class="team-row${hw?' winner-row':''}">
      <div class="seed-n">${s.home_seed}</div>
      ${logo(s.home)}
      <div class="t-name${hw?' bold':''}">${teamsMap[s.home].name.split(' ').slice(-1)[0]}</div>
      <div class="w-tag${hw?' win':' lose'}">${hw?'WIN':''}</div>
    </div>
    <div class="team-row${!hw?' winner-row':''}">
      <div class="seed-n">${s.away_seed}</div>
      ${logo(s.away)}
      <div class="t-name${!hw?' bold':''}">${teamsMap[s.away].name.split(' ').slice(-1)[0]}</div>
      <div class="w-tag${!hw?' win':' lose'}">${!hw?'WIN':''}</div>
    </div>
    <div class="card-footer">
      <div class="bar-outer"><div class="bar-inner" data-w="${s.prob_home}"></div></div>
      <div class="pct-lbl">${s.win_pct}%</div>
      ${s.is_upset?'<div class="upset-lbl">UPSET</div>':''}
      <div class="games-lbl">~${s.game_dist?.expected_games||'?'}g</div>
    </div>`;
}

// ── Reveal a card with animation ─────────────────────────────────────────────
function revealCard(el, html, delay=0, isUpset=false) {
  return new Promise(res => {
    setTimeout(() => {
      el.className = `series-card${isUpset?' upset-card':''}`;
      el.innerHTML = html;
      requestAnimationFrame(() => {
        el.classList.add('revealed');
        // animate bars after reveal
        setTimeout(() => {
          el.querySelectorAll('.bar-inner').forEach(b => { b.style.width = b.dataset.w + '%'; });
        }, 100);
      });
      res();
    }, delay);
  });
}

// ── Next round ────────────────────────────────────────────────────────────────
async function nextRound() {
  const btn = document.getElementById('btn-sim');
  btn.disabled = true;
  btn.classList.add('loading');

  await new Promise(r => setTimeout(r, 600)); // dramatic pause

  if (currentRound === 0) await revealRound1();
  else if (currentRound === 1) await revealRound2();
  else if (currentRound === 2) await revealCF();
  else if (currentRound === 3) await revealFinals();

  currentRound++;

  btn.classList.remove('loading');

  if (currentRound >= 4) {
    btn.classList.add('hidden');
    document.getElementById('btn-reset').style.display = 'inline-block';
  } else {
    btn.disabled = false;
    document.getElementById('btn-txt').textContent = BTN_LABELS[currentRound];
    document.getElementById('btn-reset').style.display = 'inline-block';
  }

  updateProgress();
}

// ── Round 1 ───────────────────────────────────────────────────────────────────
async function revealRound1() {
  for (const conf of ['East','West']) {
    const series = simData[conf].R1;
    document.getElementById(`rhdr-${conf}-0`).classList.add('active');
    for (let i = 0; i < series.length; i++) {
      const s  = series[i];
      const el = document.getElementById(`card-${conf}-0-${i}`);
      await revealCard(el, seriesHTML(s), i * 180, s.is_upset);
    }
  }
}

// ── Round 2 ───────────────────────────────────────────────────────────────────
async function revealRound2() {
  for (const conf of ['East','West']) {
    document.getElementById(`rhdr-${conf}-0`).classList.remove('active');
    document.getElementById(`rhdr-${conf}-0`).classList.add('done');
    document.getElementById(`rhdr-${conf}-1`).classList.add('active');
    const series = simData[conf].R2;
    for (let i = 0; i < series.length; i++) {
      const s  = series[i];
      const el = document.getElementById(`card-${conf}-1-${i}`);
      await revealCard(el, seriesHTML(s), i * 220, s.is_upset);
    }
  }
}

// ── Conf Finals ───────────────────────────────────────────────────────────────
async function revealCF() {
  for (const conf of ['East','West']) {
    document.getElementById(`rhdr-${conf}-1`).classList.remove('active');
    document.getElementById(`rhdr-${conf}-1`).classList.add('done');
    document.getElementById(`rhdr-${conf}-2`).classList.add('active');
    const s  = simData[conf].CF;
    const el = document.getElementById(`card-${conf}-2-0`);
    await revealCard(el, seriesHTML(s), conf === 'East' ? 0 : 300, s.is_upset);

    // Show conf champion badge
    const badge = document.getElementById(`confchamp-${conf}`);
    badge.textContent = `🏆 ${teamsMap[s.winner].name}`;
    badge.style.cssText = 'display:block;background:rgba(255,209,102,0.08);border:1px solid rgba(255,209,102,0.2);color:var(--gold);font-family:"Bebas Neue",sans-serif;font-size:0.72rem;letter-spacing:2px;padding:4px 12px;border-radius:6px;';
  }
}

// ── NBA Finals ────────────────────────────────────────────────────────────────
async function revealFinals() {
  for (const conf of ['East','West']) {
    document.getElementById(`rhdr-${conf}-2`).classList.remove('active');
    document.getElementById(`rhdr-${conf}-2`).classList.add('done');
  }

  const f          = simData.Finals;
  const real       = simData.real_results;
  const isCorrect  = f.champion === real.champion;
  const finalsEl   = document.getElementById('finals-section');

  finalsEl.innerHTML = `
    <div class="finals-title">🏆 NBA FINALS</div>
    <div class="finals-matchup">
      <div class="finals-team${f.winner===f.home?' champion':''}" id="ft-home">
        ${logo(f.home, 56)}
        <div class="finals-name">${teamsMap[f.home].name}</div>
        <div class="finals-seed">East · Seed ${teamsMap[f.home].seed}</div>
        ${f.winner===f.home?'<div class="champ-crown">🏆</div>':''}
      </div>
      <div class="vs-badge">VS</div>
      <div class="finals-team${f.winner===f.away?' champion':''}" id="ft-away">
        ${logo(f.away, 56)}
        <div class="finals-name">${teamsMap[f.away].name}</div>
        <div class="finals-seed">West · Seed ${teamsMap[f.away].seed}</div>
        ${f.winner===f.away?'<div class="champ-crown">🏆</div>':''}
      </div>
    </div>
    <div class="finals-prob-row">
      ${teamsMap[f.winner].name} wins with <span>${f.win_pct}%</span> probability · 
      ~<span>${f.game_dist?.expected_games||'?'}</span> games
    </div>`;

  finalsEl.classList.remove('hidden');
  await new Promise(r => setTimeout(r, 50));
  finalsEl.classList.add('revealed');

  await new Promise(r => setTimeout(r, 900));

  // Champion section
  const champEl = document.getElementById('champion-section');
  champEl.innerHTML = `
    <span class="champ-emoji">🏆</span>
    <div class="champ-name">${teamsMap[f.champion].name}</div>
    <div class="champ-sub">Predicted 2024-25 NBA Champion</div>
    <div class="champ-prob-badge">${f.win_pct}% Finals Win Probability</div><br/>
    <div class="correct-stamp">
      ${isCorrect ? '✅ CORRECT — Real champion: OKC Thunder' : '❌ Model predicted wrong — Real: OKC Thunder'}
    </div>`;

  champEl.classList.remove('hidden');
  await new Promise(r => setTimeout(r, 50));
  champEl.classList.add('revealed');

  if (isCorrect) {
    await new Promise(r => setTimeout(r, 400));
    launchConfetti();
  }
}

// ── Progress bar update ───────────────────────────────────────────────────────
function updateProgress() {
  for (let i = 0; i < 4; i++) {
    const dot  = document.getElementById(`dot-${i}`);
    const lbl  = document.getElementById(`dlbl-${i}`);
    const line = document.getElementById(`line-${i}`);
    if (i < currentRound) {
      dot.classList.remove('active'); dot.classList.add('done'); dot.textContent = '✓';
      lbl.classList.remove('active'); lbl.classList.add('done');
      if (line) line.classList.add('done');
    } else if (i === currentRound) {
      dot.classList.remove('done'); dot.classList.add('active');
      lbl.classList.remove('done'); lbl.classList.add('active');
    } else {
      dot.classList.remove('active','done');
      lbl.classList.remove('active','done');
    }
  }
}

// ── Confetti ──────────────────────────────────────────────────────────────────
function launchConfetti() {
  const colors = ['#f75c03','#ffd166','#06d6a0','#4cc9f0','#c084fc','#fff'];
  for (let i = 0; i < 120; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.cssText = `
      left:${Math.random()*100}vw;
      top:-10px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      width:${6+Math.random()*8}px;
      height:${6+Math.random()*8}px;
      border-radius:${Math.random()>0.5?'50%':'2px'};
      animation-duration:${2+Math.random()*3}s;
      animation-delay:${Math.random()*1.5}s;
    `;
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }
}

// ── Reset ─────────────────────────────────────────────────────────────────────
function resetSim() {
  currentRound = 0;
  document.getElementById('bracket-area').innerHTML = '';
  document.getElementById('finals-section').classList.add('hidden');
  document.getElementById('finals-section').classList.remove('revealed');
  document.getElementById('champion-section').classList.add('hidden');
  document.getElementById('champion-section').classList.remove('revealed');
  document.getElementById('btn-sim').disabled = false;
  document.getElementById('btn-sim').classList.remove('hidden');
  document.getElementById('btn-txt').textContent = BTN_LABELS[0];
  document.getElementById('btn-reset').style.display = 'none';
  buildBracketShell();
  for (let i = 0; i < 4; i++) {
    const dot = document.getElementById(`dot-${i}`);
    const lbl = document.getElementById(`dlbl-${i}`);
    const line = document.getElementById(`line-${i}`);
    dot.classList.remove('done','active');
    lbl.classList.remove('done','active');
    if (line) line.classList.remove('done');
    dot.textContent = ROUND_LABELS[i];
  }
  document.getElementById('dot-0').classList.add('active');
  document.getElementById('dlbl-0').classList.add('active');
}

load();

// ── Auth nav ──────────────────────────────────────────────────────────────────
(async function(){
  try{
    const res=await fetch('/auth/me/');
    const d=await res.json();
    const nl=document.querySelector('.nav-links');
    if(!nl||!d.authenticated)return;
    const init=(d.full_name||d.username).split(' ').map(n=>n[0]).join('').slice(0,2).toUpperCase();
    const p=document.createElement('div');
    p.style.cssText='display:flex;align-items:center;gap:8px;margin-left:8px;padding:4px 4px 4px 12px;border-radius:20px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);';
    p.innerHTML=`<span style="font-size:.82rem;color:#e2e2ee;font-weight:500">${d.full_name||d.username}</span><div style="width:28px;height:28px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:11px;color:#fff">${init}</div><button onclick="doLogout()" style="background:none;border:none;cursor:pointer;color:#5a5a7a;padding:4px 6px;font-size:12px" title="Sign out">✕</button>`;
    nl.appendChild(p);
  }catch(e){}
})();
async function doLogout(){await fetch('/auth/logout/',{method:'POST'});window.location.href='/login/';}
</script>
