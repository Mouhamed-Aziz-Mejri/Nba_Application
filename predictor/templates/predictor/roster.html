<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Roster — NBA 2024/25</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#07080d; --surface:#0f1018; --card:#161820;
      --border:rgba(255,255,255,0.06);
      --orange:#f75c03; --glow:rgba(247,92,3,0.2);
      --gold:#ffd166; --text:#e2e2ee; --muted:#5a5a7a;
      --green:#06d6a0; --blue:#4cc9f0; --purple:#c084fc;
    }
    body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; min-height:100vh; }
    body::before {
      content:''; position:fixed; inset:0;
      background:
        radial-gradient(ellipse 80% 50% at 80% 10%, rgba(247,92,3,0.05) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 10% 90%, rgba(76,201,240,0.04) 0%, transparent 60%);
      pointer-events:none; z-index:0;
    }
    nav {
      position:sticky; top:0; z-index:100;
      background:rgba(7,8,13,0.85); backdrop-filter:blur(16px);
      border-bottom:1px solid var(--border);
      padding:0 32px; display:flex; align-items:center; gap:16px; height:60px;
    }
    .nav-brand {
      font-family:'Bebas Neue',sans-serif; font-size:1.4rem; letter-spacing:3px;
      background:linear-gradient(135deg,#fff,var(--gold));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
      text-decoration:none;
    }
    .nav-sep { color:var(--border); font-size:1.2rem; }
    .nav-team { font-family:'Bebas Neue',sans-serif; font-size:1.2rem; letter-spacing:2px; color:var(--orange); }
    .nav-links { display:flex; gap:4px; margin-left:auto; }
    .nav-link {
      padding:6px 14px; border-radius:8px; font-size:0.85rem;
      color:var(--muted); text-decoration:none; transition:color 0.2s,background 0.2s;
    }
    .nav-link:hover { color:var(--text); background:rgba(255,255,255,0.05); }

    .wrapper { position:relative; z-index:1; max-width:1300px; margin:0 auto; padding:48px 24px 80px; }

    .page-header {
      display:flex; align-items:flex-end; justify-content:space-between;
      margin-bottom:28px; flex-wrap:wrap; gap:16px;
      animation:fadeDown 0.5s ease both;
    }
    .header-left h1 {
      font-family:'Bebas Neue',sans-serif;
      font-size:clamp(2.8rem,6vw,4.5rem); letter-spacing:5px; line-height:1;
    }
    .header-left h1 .abbr { color:var(--orange); }
    .header-left p { color:var(--muted); font-size:0.88rem; margin-top:6px; letter-spacing:1px; }
    .back-btn {
      display:inline-flex; align-items:center; gap:8px;
      padding:10px 18px; border-radius:10px;
      background:var(--card); border:1px solid var(--border);
      color:var(--muted); text-decoration:none; font-size:0.85rem;
      transition:color 0.2s,border-color 0.2s;
    }
    .back-btn:hover { color:var(--text); border-color:rgba(255,255,255,0.15); }

    /* ── Stats pills ── */
    .stats-bar { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:24px; animation:fadeUp 0.4s 0.1s ease both; }
    .stat-pill {
      background:var(--card); border:1px solid var(--border);
      border-radius:10px; padding:12px 18px;
      display:flex; flex-direction:column; gap:2px;
    }
    .stat-pill .label { font-size:0.7rem; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); }
    .stat-pill .value { font-family:'Bebas Neue',sans-serif; font-size:1.4rem; letter-spacing:2px; color:var(--orange); }

    /* ── Filter row ── */
    .filter-row {
      display:flex; gap:12px; align-items:center; flex-wrap:wrap;
      margin-bottom:20px; animation:fadeUp 0.4s 0.15s ease both;
    }
    .search-wrap { position:relative; flex:1; max-width:280px; }
    .search-icon { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:13px; pointer-events:none; }
    .search-input {
      width:100%; background:var(--card); border:1px solid var(--border);
      border-radius:10px; color:var(--text);
      font-family:'DM Sans',sans-serif; font-size:0.88rem;
      padding:9px 13px 9px 36px; outline:none;
      transition:border-color 0.2s,box-shadow 0.2s;
    }
    .search-input:focus { border-color:var(--orange); box-shadow:0 0 0 3px var(--glow); }
    .search-input::placeholder { color:var(--muted); }

    .pos-filter { display:flex; gap:4px; }
    .pos-btn {
      padding:7px 12px; border-radius:8px; cursor:pointer;
      background:var(--card); border:1px solid var(--border);
      color:var(--muted); font-size:0.8rem; font-family:'DM Sans',sans-serif;
      transition:all 0.15s;
    }
    .pos-btn.active { background:var(--orange); border-color:var(--orange); color:#fff; }
    .pos-btn:hover:not(.active) { border-color:rgba(255,255,255,0.2); color:var(--text); }

    .sort-info { font-size:0.75rem; color:var(--muted); margin-left:auto; }

    /* ── Table ── */
    .table-wrap {
      background:var(--card); border:1px solid var(--border);
      border-radius:18px; overflow:auto;
      animation:fadeUp 0.4s 0.2s ease both;
    }
    table { width:100%; border-collapse:collapse; min-width:900px; }
    thead tr {
      background:rgba(247,92,3,0.06);
      border-bottom:1px solid rgba(247,92,3,0.15);
    }
    th {
      padding:14px 14px; text-align:left;
      font-family:'Bebas Neue',sans-serif;
      font-size:0.8rem; letter-spacing:2px;
      color:var(--orange); font-weight:400;
      cursor:pointer; user-select:none; white-space:nowrap;
    }
    th:hover { color:var(--gold); }
    th .sort-icon { opacity:0.4; font-size:10px; margin-left:3px; }
    th.sorted .sort-icon { opacity:1; }

    tbody tr {
      border-bottom:1px solid var(--border);
      transition:background 0.15s;
    }
    tbody tr:last-child { border-bottom:none; }
    tbody tr:hover { background:rgba(255,255,255,0.03); }
    td { padding:11px 14px; font-size:0.86rem; white-space:nowrap; }

    /* player name cell */
    .player-cell { display:flex; align-items:center; gap:10px; }
    .avatar {
      width:32px; height:32px; border-radius:50%;
      background:linear-gradient(135deg,var(--orange),var(--gold));
      display:flex; align-items:center; justify-content:center;
      font-size:11px; font-weight:700; color:#fff; flex-shrink:0;
    }
    .player-name { font-weight:600; color:var(--text); }

    /* position badge */
    .pos-tag {
      display:inline-flex; align-items:center; justify-content:center;
      padding:3px 9px; border-radius:6px;
      font-size:0.7rem; letter-spacing:1px; font-weight:700;
      min-width:36px;
    }
    .pos-PG { background:rgba(76,201,240,0.12);  color:var(--blue);   border:1px solid rgba(76,201,240,0.2); }
    .pos-SG { background:rgba(247,92,3,0.12);    color:var(--orange); border:1px solid rgba(247,92,3,0.2); }
    .pos-SF { background:rgba(6,214,160,0.12);   color:var(--green);  border:1px solid rgba(6,214,160,0.2); }
    .pos-PF { background:rgba(255,209,102,0.12); color:var(--gold);   border:1px solid rgba(255,209,102,0.2); }
    .pos-C  { background:rgba(192,132,252,0.12); color:var(--purple); border:1px solid rgba(192,132,252,0.2); }
    .pos-unknown { background:rgba(90,90,122,0.12); color:var(--muted); border:1px solid var(--border); }

    .stat-num { color:var(--text); }
    .stat-hi  { color:var(--gold); font-weight:600; }

    /* action buttons */
    .action-cell { display:flex; gap:6px; align-items:center; }
    .btn-action {
      padding:4px 10px; border-radius:6px; cursor:pointer;
      font-size:0.72rem; font-family:'DM Sans',sans-serif; font-weight:600;
      border:1px solid; transition:background 0.15s; white-space:nowrap;
    }
    .btn-predict { background:rgba(247,92,3,0.1); border-color:rgba(247,92,3,0.25); color:var(--orange); }
    .btn-predict:hover { background:var(--orange); color:#fff; border-color:var(--orange); }
    .btn-similar { background:rgba(76,201,240,0.08); border-color:rgba(76,201,240,0.2); color:var(--blue); }
    .btn-similar:hover { background:var(--blue); color:#000; border-color:var(--blue); }

    .no-results { text-align:center; padding:60px 20px; color:var(--muted); font-size:0.9rem; }
    .state-box  { text-align:center; padding:80px 20px; color:var(--muted); }
    .spinner-lg {
      width:40px; height:40px;
      border:3px solid var(--border); border-top-color:var(--orange);
      border-radius:50%; animation:spin 0.8s linear infinite;
      margin:0 auto 16px;
    }
    .hidden { display:none !important; }
    @keyframes fadeDown { from{opacity:0;transform:translateY(-16px)} to{opacity:1;transform:translateY(0)} }
    @keyframes fadeUp   { from{opacity:0;transform:translateY(16px)}  to{opacity:1;transform:translateY(0)} }
    @keyframes spin     { to{transform:rotate(360deg)} }
  </style>
</head>
<body>

<nav>
  <a href="/" class="nav-brand">🏀 NBA Predictor</a>
  <span class="nav-sep">/</span>
  <span class="nav-team" id="nav-team">—</span>
  <div class="nav-links">
    <a href="/"         class="nav-link">Predict</a>
    <a href="/teams/"   class="nav-link">Teams</a>
    <a href="/similar/" class="nav-link">Similarity</a>
    <a href="/login/" class="nav-link" style="color:var(--gold);border:1px solid rgba(255,209,102,0.2);margin-left:8px">⚡ Login</a>
  </div>
</nav>

<div class="wrapper">

  <div class="page-header">
    <div class="header-left">
      <h1><span class="abbr" id="team-abbr">—</span> Roster</h1>
      <p id="team-fullname">2024 / 25 Season</p>
    </div>
    <a href="/teams/" class="back-btn">← All Teams</a>
  </div>

  <!-- Stats pills -->
  <div class="stats-bar" id="stats-bar" style="display:none">
    <div class="stat-pill"><span class="label">Players</span><span class="value" id="pill-players">—</span></div>
    <div class="stat-pill"><span class="label">Avg PTS</span><span class="value" id="pill-pts">—</span></div>
    <div class="stat-pill"><span class="label">Avg AST</span><span class="value" id="pill-ast">—</span></div>
    <div class="stat-pill"><span class="label">Avg REB</span><span class="value" id="pill-reb">—</span></div>
    <div class="stat-pill"><span class="label">Avg AGE</span><span class="value" id="pill-age">—</span></div>
  </div>

  <!-- Filters -->
  <div class="filter-row" id="filter-row" style="display:none">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="search" type="text" placeholder="Search player…"/>
    </div>
    <div class="pos-filter">
      <button class="pos-btn active" data-pos="ALL">All</button>
      <button class="pos-btn" data-pos="PG">PG</button>
      <button class="pos-btn" data-pos="SG">SG</button>
      <button class="pos-btn" data-pos="SF">SF</button>
      <button class="pos-btn" data-pos="PF">PF</button>
      <button class="pos-btn" data-pos="C">C</button>
    </div>
    <span class="sort-info" id="sort-info"></span>
  </div>

  <!-- Loading -->
  <div class="state-box" id="loading">
    <div class="spinner-lg"></div>
    <p>Loading roster…</p>
  </div>

  <!-- Error -->
  <div class="state-box hidden" id="error-state">
    <p id="error-msg"></p>
  </div>

  <!-- Table -->
  <div class="table-wrap hidden" id="table-wrap">
    <table>
      <thead>
        <tr>
          <th data-col="name">Player <span class="sort-icon">↕</span></th>
          <th data-col="Pos">Position <span class="sort-icon">↕</span></th>
          <th data-col="Age">Age <span class="sort-icon">↕</span></th>
          <th data-col="G">G <span class="sort-icon">↕</span></th>
          <th data-col="MP">MP <span class="sort-icon">↕</span></th>
          <th data-col="PTS">PTS <span class="sort-icon">↕</span></th>
          <th data-col="TRB">REB <span class="sort-icon">↕</span></th>
          <th data-col="AST">AST <span class="sort-icon">↕</span></th>
          <th data-col="STL">STL <span class="sort-icon">↕</span></th>
          <th data-col="BLK">BLK <span class="sort-icon">↕</span></th>
          <th data-col="FG%">FG% <span class="sort-icon">↕</span></th>
          <th data-col="3P%">3P% <span class="sort-icon">↕</span></th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="roster-body"></tbody>
    </table>
    <div class="no-results hidden" id="no-results">No players match your search.</div>
  </div>

</div>

<script>
const API      = 'http://127.0.0.1:8000';
const teamCode = window.location.pathname.split('/').filter(Boolean).pop().toUpperCase();

const TEAM_NAMES = {
  ATL:'Atlanta Hawks',BOS:'Boston Celtics',BRK:'Brooklyn Nets',
  CHO:'Charlotte Hornets',CHI:'Chicago Bulls',CLE:'Cleveland Cavaliers',
  DAL:'Dallas Mavericks',DEN:'Denver Nuggets',DET:'Detroit Pistons',
  GSW:'Golden State Warriors',HOU:'Houston Rockets',IND:'Indiana Pacers',
  LAC:'LA Clippers',LAL:'Los Angeles Lakers',MEM:'Memphis Grizzlies',
  MIA:'Miami Heat',MIL:'Milwaukee Bucks',MIN:'Minnesota Timberwolves',
  NOP:'New Orleans Pelicans',NYK:'New York Knicks',OKC:'Oklahoma City Thunder',
  ORL:'Orlando Magic',PHI:'Philadelphia 76ers',PHO:'Phoenix Suns',
  POR:'Portland Trail Blazers',SAC:'Sacramento Kings',SAS:'San Antonio Spurs',
  TOR:'Toronto Raptors',UTA:'Utah Jazz',WAS:'Washington Wizards',
};

let allPlayers = [];
let sortCol = 'PTS', sortAsc = false;
let filterPos = 'ALL', searchQuery = '';

// Init
document.getElementById('nav-team').textContent  = teamCode;
document.getElementById('team-abbr').textContent = teamCode;
document.getElementById('team-fullname').textContent = (TEAM_NAMES[teamCode] || teamCode) + ' · 2024/25 Season';
document.title = `${teamCode} Roster — NBA 2024/25`;

async function loadRoster() {
  try {
    const res  = await fetch(`${API}/api/teams/${teamCode}/`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed');

    allPlayers = data.players;
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('table-wrap').classList.remove('hidden');
    document.getElementById('stats-bar').style.display = 'flex';
    document.getElementById('filter-row').style.display = 'flex';
    renderPills(data.players);
    renderTable();
  } catch(e) {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('error-state').classList.remove('hidden');
    document.getElementById('error-msg').textContent = '⚠️ ' + e.message;
  }
}

function avg(players, key) {
  const vals = players.map(p => p[key]).filter(v => v != null && v !== 0);
  if (!vals.length) return '—';
  return (vals.reduce((a,b) => a+b, 0) / vals.length).toFixed(1);
}

function renderPills(players) {
  document.getElementById('pill-players').textContent = players.length;
  document.getElementById('pill-pts').textContent     = avg(players, 'PTS');
  document.getElementById('pill-ast').textContent     = avg(players, 'AST');
  document.getElementById('pill-reb').textContent     = avg(players, 'TRB');
  document.getElementById('pill-age').textContent     = avg(players, 'Age');
}

function posTagHTML(pos) {
  if (!pos || pos === 'null') return '<span class="pos-tag pos-unknown">—</span>';
  const cls = ['PG','SG','SF','PF','C'].includes(pos) ? `pos-${pos}` : 'pos-unknown';
  return `<span class="pos-tag ${cls}">${pos}</span>`;
}

function renderTable() {
  let players = [...allPlayers];

  if (filterPos !== 'ALL') {
    players = players.filter(p => p.Pos === filterPos);
  }
  if (searchQuery) {
    players = players.filter(p => p.name.toLowerCase().includes(searchQuery));
  }

  players.sort((a, b) => {
    let av = sortCol === 'name' ? a.name : (a[sortCol] ?? -Infinity);
    let bv = sortCol === 'name' ? b.name : (b[sortCol] ?? -Infinity);
    if (av < bv) return sortAsc ? -1 : 1;
    if (av > bv) return sortAsc ?  1 : -1;
    return 0;
  });

  // Update sort icons
  document.querySelectorAll('th').forEach(th => {
    th.classList.remove('sorted');
    const ic = th.querySelector('.sort-icon');
    if (ic) ic.textContent = '↕';
  });
  const ath = document.querySelector(`th[data-col="${sortCol}"]`);
  if (ath) {
    ath.classList.add('sorted');
    const ic = ath.querySelector('.sort-icon');
    if (ic) ic.textContent = sortAsc ? '↑' : '↓';
  }

  document.getElementById('sort-info').textContent =
    `${players.length} player${players.length !== 1 ? 's' : ''}`;

  const body = document.getElementById('roster-body');
  const noRes = document.getElementById('no-results');

  if (!players.length) { body.innerHTML = ''; noRes.classList.remove('hidden'); return; }
  noRes.classList.add('hidden');

  const init = name => name.split(' ').map(n=>n[0]).join('').slice(0,2).toUpperCase();
  const fmt  = (v, pct) => v != null ? (pct ? (v*100).toFixed(1)+'%' : v) : '—';

  body.innerHTML = players.map(p => `
    <tr>
      <td>
        <div class="player-cell">
          <div class="avatar">${init(p.name)}</div>
          <span class="player-name">${p.name}</span>
        </div>
      </td>
      <td>${posTagHTML(p.Pos)}</td>
      <td class="stat-num">${p.Age ?? '—'}</td>
      <td class="stat-num">${p.G  ?? '—'}</td>
      <td class="stat-num">${p.MP ?? '—'}</td>
      <td class="stat-hi">${fmt(p.PTS)}</td>
      <td class="stat-num">${fmt(p.TRB)}</td>
      <td class="stat-num">${fmt(p.AST)}</td>
      <td class="stat-num">${fmt(p.STL)}</td>
      <td class="stat-num">${fmt(p.BLK)}</td>
      <td class="stat-num">${fmt(p['FG%'], true)}</td>
      <td class="stat-num">${fmt(p['3P%'], true)}</td>
      <td>
        <div class="action-cell">
          <button class="btn-action btn-predict"
            onclick="predictPlayer('${p.name.replace(/'/g,"\\'")}',${JSON.stringify(p)})">
            ⚡ Predict
          </button>
          <button class="btn-action btn-similar"
            onclick="window.location.href='/similar/?q=${encodeURIComponent(p.name)}'">
            ≈ Similar
          </button>
        </div>
      </td>
    </tr>`).join('');
}

// Sorting
document.querySelectorAll('th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (sortCol === col) sortAsc = !sortAsc;
    else { sortCol = col; sortAsc = false; }
    renderTable();
  });
});

// Search
document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value.toLowerCase().trim();
  renderTable();
});

// Position filter
document.querySelectorAll('.pos-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.pos-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filterPos = btn.dataset.pos;
    renderTable();
  });
});

function predictPlayer(name, stats) {
  const p = new URLSearchParams({
    player_name: name, AST: stats.AST??'', STL: stats.STL??'',
    BLK: stats.BLK??'', FGP: stats['FG%']??'', TPP: stats['3P%']??'',
    FTP: stats['FT%']??'', MP: stats.MP??'', TOV: stats.TOV??'',
  });
  window.location.href = `/?${p.toString()}`;
}

loadRoster();
</script>
</body>
</html>
