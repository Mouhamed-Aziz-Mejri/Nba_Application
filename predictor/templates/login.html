<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — NBA Predictor</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --court:#07080d; --panel:#0f1018; --card:#161820;
      --border:rgba(255,255,255,0.06);
      --orange:#f75c03; --orange-glow:rgba(247,92,3,0.22);
      --gold:#ffd166; --text:#e2e2ee; --muted:#5a5a7a;
      --green:#06d6a0; --red:#ef233c;
    }

    body {
      background: var(--court); color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh; overflow-x: hidden;
      display: flex; flex-direction: column;
    }

    body::before {
      content: ''; position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 50% 0%, rgba(247,92,3,0.07) 0%, transparent 65%),
        radial-gradient(ellipse 40% 40% at 100% 100%, rgba(255,209,102,0.03) 0%, transparent 60%),
        repeating-linear-gradient(0deg, transparent, transparent 79px, rgba(255,255,255,0.015) 80px),
        repeating-linear-gradient(90deg, transparent, transparent 79px, rgba(255,255,255,0.015) 80px);
      pointer-events: none; z-index: 0;
    }

    /* ── Nav ── */
    nav {
      position: relative; z-index: 10;
      background: rgba(7,8,13,0.85); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 0 32px; display: flex; align-items: center; height: 60px;
    }
    .nav-brand {
      font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; letter-spacing: 3px;
      background: linear-gradient(135deg, #fff, var(--gold));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      text-decoration: none;
    }

    /* ── Main layout ── */
    .page {
      position: relative; z-index: 1; flex: 1;
      display: flex; align-items: center; justify-content: center;
      padding: 48px 24px;
    }

    .login-wrap {
      width: 100%; max-width: 420px;
      animation: fadeUp 0.5s ease both;
    }

    /* Header */
    .login-header { text-align: center; margin-bottom: 36px; }
    .logo-row {
      display: flex; align-items: center; justify-content: center;
      gap: 14px; margin-bottom: 10px;
    }
    .ball-icon {
      width: 48px; height: 48px; background: var(--orange);
      border-radius: 50%; position: relative;
      box-shadow: 0 0 28px var(--orange-glow); flex-shrink: 0;
    }
    .ball-icon::before {
      content: ''; position: absolute; inset: 7px;
      border: 2px solid rgba(0,0,0,0.35); border-radius: 50%;
    }
    .ball-icon::after {
      content: ''; position: absolute; top: 50%; left: -4px; right: -4px;
      height: 2px; background: rgba(0,0,0,0.3); transform: translateY(-50%);
    }
    .login-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.6rem; letter-spacing: 4px; line-height: 1;
      background: linear-gradient(135deg, #fff 30%, var(--gold));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .login-header p {
      color: var(--muted); font-size: 0.88rem; letter-spacing: 2px;
      text-transform: uppercase; margin-top: 6px;
    }

    /* Card */
    .login-card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 20px; padding: 36px 32px;
    }

    .card-title {
      font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; letter-spacing: 2px;
      color: var(--orange); margin-bottom: 24px;
      padding-bottom: 12px; border-bottom: 1px solid var(--border);
    }

    /* Tab switcher */
    .tab-row {
      display: grid; grid-template-columns: 1fr 1fr;
      background: var(--card); border-radius: 10px;
      padding: 4px; gap: 4px; margin-bottom: 28px;
    }
    .tab-btn {
      padding: 9px; border-radius: 7px; border: none; cursor: pointer;
      font-family: 'DM Sans', sans-serif; font-size: 0.88rem; font-weight: 600;
      color: var(--muted); background: transparent;
      transition: color 0.2s, background 0.2s;
      letter-spacing: 0.5px;
    }
    .tab-btn.active {
      background: var(--panel); color: var(--orange);
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    /* Form fields */
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    label {
      font-size: 0.78rem; letter-spacing: 1px; text-transform: uppercase;
      color: var(--muted); font-weight: 500;
    }
    .input-wrap { position: relative; }
    .input-wrap input {
      width: 100%; background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text);
      font-family: 'DM Sans', sans-serif; font-size: 0.95rem;
      padding: 11px 14px; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-wrap input:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 3px var(--orange-glow);
    }
    .input-wrap input::placeholder { color: var(--muted); }
    .input-wrap input[type="password"] { padding-right: 42px; }

    .toggle-pw {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: var(--muted);
      font-size: 16px; padding: 2px; transition: color 0.15s;
      display: flex; align-items: center;
    }
    .toggle-pw:hover { color: var(--text); }

    .field-hint {
      font-size: 0.7rem; color: var(--muted); margin-top: 2px;
    }

    /* Forgot password */
    .forgot-row {
      display: flex; justify-content: flex-end; margin-top: -8px; margin-bottom: 16px;
    }
    .forgot-link {
      font-size: 0.78rem; color: var(--muted); text-decoration: none;
      transition: color 0.15s;
    }
    .forgot-link:hover { color: var(--orange); }

    /* Divider */
    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 20px 0; color: var(--muted); font-size: 0.78rem;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    /* Submit button */
    .btn-submit {
      width: 100%; padding: 14px; background: var(--orange); border: none;
      border-radius: 12px; color: #fff;
      font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; letter-spacing: 3px;
      cursor: pointer; transition: transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 20px var(--orange-glow); margin-top: 4px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(247,92,3,0.45); }
    .btn-submit:active { transform: translateY(0); }
    .btn-submit:disabled { background: #222; box-shadow: none; cursor: not-allowed; transform: none; }
    .btn-submit .spinner {
      display: none; width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff;
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    .btn-submit.loading .btn-text { display: none; }
    .btn-submit.loading .spinner  { display: block; }

    /* Alert messages */
    .alert {
      padding: 11px 14px; border-radius: 10px;
      font-size: 0.87rem; margin-bottom: 16px; display: none;
    }
    .alert.visible { display: flex; align-items: center; gap: 8px; }
    .alert-error {
      background: rgba(239,35,60,0.08); border: 1px solid rgba(239,35,60,0.2);
      color: var(--red);
    }
    .alert-success {
      background: rgba(6,214,160,0.08); border: 1px solid rgba(6,214,160,0.2);
      color: var(--green);
    }

    /* Password strength */
    .strength-wrap { margin-top: 8px; display: none; }
    .strength-wrap.visible { display: block; }
    .strength-bar {
      height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; margin-bottom: 4px;
    }
    .strength-fill {
      height: 100%; border-radius: 2px; width: 0; transition: width 0.3s, background 0.3s;
    }
    .strength-label { font-size: 0.7rem; color: var(--muted); }

    /* Remember me / terms */
    .check-row {
      display: flex; align-items: center; gap: 10px; margin-bottom: 16px; cursor: pointer;
    }
    .check-row input[type="checkbox"] { display: none; }
    .check-box {
      width: 18px; height: 18px; border-radius: 5px; flex-shrink: 0;
      background: var(--card); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.15s, background 0.15s;
      font-size: 11px; color: transparent;
    }
    .check-row input:checked + .check-box {
      background: var(--orange); border-color: var(--orange); color: #fff;
    }
    .check-label { font-size: 0.82rem; color: var(--muted); }
    .check-label a { color: var(--orange); text-decoration: none; }
    .check-label a:hover { text-decoration: underline; }

    /* Bottom link */
    .switch-link {
      text-align: center; margin-top: 22px;
      font-size: 0.84rem; color: var(--muted);
    }
    .switch-link a { color: var(--orange); text-decoration: none; font-weight: 600; }
    .switch-link a:hover { text-decoration: underline; }

    /* Register-only fields (hidden on login tab) */
    .register-only { display: none; }
    .login-only    { display: block; }

    /* ── Decorative court lines ── */
    .court-deco {
      position: fixed; bottom: -60px; left: 50%; transform: translateX(-50%);
      width: 500px; height: 250px; border: 1px solid rgba(247,92,3,0.06);
      border-radius: 250px 250px 0 0; pointer-events: none; z-index: 0;
    }
    .court-deco::after {
      content: ''; position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      width: 80px; height: 80px; border: 1px solid rgba(247,92,3,0.05); border-radius: 50%;
    }

    @keyframes fadeUp  { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
    @keyframes spin    { to{transform:rotate(360deg)} }
  </style>
</head>
<body>

<nav>
  <a href="/" class="nav-brand">🏀 NBA Predictor</a>
</nav>

<div class="court-deco"></div>

<div class="page">
  <div class="login-wrap">

    <div class="login-header">
      <div class="logo-row">
        <div class="ball-icon"></div>
        <h1>NBA PREDICTOR</h1>
      </div>
      <p>Player Score Analysis System</p>
    </div>

    <div class="login-card">

      <div class="card-title" id="card-title">SIGN IN</div>

      <!-- Tab switcher -->
      <div class="tab-row">
        <button class="tab-btn active" id="tab-login"    onclick="switchTab('login')">Login</button>
        <button class="tab-btn"        id="tab-register" onclick="switchTab('register')">Register</button>
      </div>

      <!-- Alert -->
      <div class="alert alert-error"   id="alert-error"></div>
      <div class="alert alert-success" id="alert-success"></div>

      <!-- Form -->
      <form id="auth-form" onsubmit="handleSubmit(event)" novalidate>

        <!-- Register only: Full name -->
        <div class="field register-only" id="field-name">
          <label for="full-name">Full Name</label>
          <div class="input-wrap">
            <input type="text" id="full-name" placeholder="e.g. John Smith" autocomplete="name"/>
          </div>
        </div>

        <!-- Email -->
        <div class="field">
          <label for="email">Email Address</label>
          <div class="input-wrap">
            <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required/>
          </div>
        </div>

        <!-- Password -->
        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required/>
            <button type="button" class="toggle-pw" onclick="togglePw()" id="pw-toggle" title="Show password">
              <svg id="eye-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <!-- Password strength (register only) -->
          <div class="strength-wrap" id="strength-wrap">
            <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
            <span class="strength-label" id="strength-label">Enter a password</span>
          </div>
        </div>

        <!-- Register only: Confirm password -->
        <div class="field register-only" id="field-confirm">
          <label for="confirm">Confirm Password</label>
          <div class="input-wrap">
            <input type="password" id="confirm" placeholder="••••••••" autocomplete="new-password"/>
          </div>
          <span class="field-hint" id="confirm-hint"></span>
        </div>

        <!-- Login only: Forgot password -->
        <div class="forgot-row login-only" id="row-forgot">
          <a href="#" class="forgot-link" onclick="showForgot(event)">Forgot password?</a>
        </div>

        <!-- Remember me (login) / Terms (register) -->
        <label class="check-row" id="row-check">
          <input type="checkbox" id="remember"/>
          <div class="check-box" id="check-visual">✓</div>
          <span class="check-label" id="check-label">Remember me for 30 days</span>
        </label>

        <button class="btn-submit" id="submit-btn" type="submit">
          <span class="btn-text" id="btn-text">SIGN IN</span>
          <div class="spinner"></div>
        </button>

      </form>

      <div class="switch-link" id="switch-link">
        Don't have an account? <a href="#" onclick="switchTab('register'); return false;">Create one</a>
      </div>

    </div>
  </div>
</div>

<script>
let currentTab = 'login';
let pwVisible  = false;

// ── Tab switcher ──────────────────────────────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  clearAlerts();

  const isLogin = tab === 'login';

  document.getElementById('tab-login').classList.toggle('active', isLogin);
  document.getElementById('tab-register').classList.toggle('active', !isLogin);

  document.getElementById('card-title').textContent = isLogin ? 'SIGN IN' : 'CREATE ACCOUNT';
  document.getElementById('btn-text').textContent   = isLogin ? 'SIGN IN' : 'CREATE ACCOUNT';
  document.getElementById('switch-link').innerHTML  = isLogin
    ? 'Don\'t have an account? <a href="#" onclick="switchTab(\'register\'); return false;">Create one</a>'
    : 'Already have an account? <a href="#" onclick="switchTab(\'login\'); return false;">Sign in</a>';

  // Toggle field visibility
  document.querySelectorAll('.register-only').forEach(el => {
    el.style.display = isLogin ? 'none' : 'flex';
  });
  document.querySelectorAll('.login-only').forEach(el => {
    el.style.display = isLogin ? 'block' : 'none';
  });

  document.getElementById('strength-wrap').classList.toggle('visible', !isLogin);
  document.getElementById('check-label').textContent = isLogin
    ? 'Remember me for 30 days'
    : 'I agree to the Terms of Service';
  document.getElementById('remember').checked = false;

  // Reset form
  document.getElementById('auth-form').reset();
  document.getElementById('confirm-hint').textContent = '';
  document.getElementById('password').setAttribute('autocomplete', isLogin ? 'current-password' : 'new-password');
}

// ── Password visibility ───────────────────────────────────────────────────────
function togglePw() {
  pwVisible = !pwVisible;
  const inp = document.getElementById('password');
  const con = document.getElementById('confirm');
  inp.type = pwVisible ? 'text' : 'password';
  if (con) con.type = pwVisible ? 'text' : 'password';
  document.getElementById('eye-icon').innerHTML = pwVisible
    ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
    : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
}

// ── Password strength ─────────────────────────────────────────────────────────
document.getElementById('password').addEventListener('input', function() {
  if (currentTab !== 'register') return;
  const val = this.value;
  let score = 0;
  if (val.length >= 8)           score++;
  if (/[A-Z]/.test(val))         score++;
  if (/[0-9]/.test(val))         score++;
  if (/[^A-Za-z0-9]/.test(val))  score++;

  const labels = ['Too short', 'Weak', 'Fair', 'Good', 'Strong'];
  const colors = ['#ef233c', '#ef233c', '#ffd166', '#f75c03', '#06d6a0'];
  const widths = ['15%', '30%', '55%', '75%', '100%'];

  document.getElementById('strength-fill').style.width      = val ? widths[score] : '0';
  document.getElementById('strength-fill').style.background = colors[score];
  document.getElementById('strength-label').textContent     = val ? labels[score] : 'Enter a password';
});

// ── Confirm password check ────────────────────────────────────────────────────
document.getElementById('confirm').addEventListener('input', function() {
  const pw   = document.getElementById('password').value;
  const hint = document.getElementById('confirm-hint');
  if (!this.value) { hint.textContent = ''; return; }
  if (this.value === pw) {
    hint.style.color = 'var(--green)'; hint.textContent = '✓ Passwords match';
  } else {
    hint.style.color = 'var(--red)';   hint.textContent = '✗ Passwords do not match';
  }
});

// ── Submit ────────────────────────────────────────────────────────────────────
async function handleSubmit(e) {
  e.preventDefault();
  clearAlerts();

  const btn      = document.getElementById('submit-btn');
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  // Basic validation
  if (!email || !password) {
    showError('Please fill in all required fields.');
    return;
  }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showError('Please enter a valid email address.');
    return;
  }

  if (currentTab === 'register') {
    const name    = document.getElementById('full-name').value.trim();
    const confirm = document.getElementById('confirm').value;
    if (!name) { showError('Please enter your full name.'); return; }
    if (password.length < 8) { showError('Password must be at least 8 characters.'); return; }
    if (password !== confirm) { showError('Passwords do not match.'); return; }
    if (!document.getElementById('remember').checked) {
      showError('Please agree to the Terms of Service.'); return;
    }
  }

  // Simulate async request
  btn.disabled = true;
  btn.classList.add('loading');

  await new Promise(r => setTimeout(r, 1200));

  btn.disabled = false;
  btn.classList.remove('loading');

  if (currentTab === 'login') {
    // Demo: accept any credentials
    showSuccess('✓ Signed in successfully! Redirecting…');
    setTimeout(() => window.location.href = '/', 1200);
  } else {
    showSuccess('✓ Account created! You can now sign in.');
    setTimeout(() => switchTab('login'), 1500);
  }
}

function showForgot(e) {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  if (!email) {
    showError('Enter your email address first, then click "Forgot password".');
    return;
  }
  showSuccess(`✓ Password reset link sent to ${email}`);
}

function showError(msg)   { const el = document.getElementById('alert-error');   el.textContent = '⚠️  ' + msg; el.classList.add('visible'); }
function showSuccess(msg) { const el = document.getElementById('alert-success'); el.textContent = msg;          el.classList.add('visible'); }
function clearAlerts() {
  document.getElementById('alert-error').classList.remove('visible');
  document.getElementById('alert-success').classList.remove('visible');
}

// Init
switchTab('login');
</script>
</body>
</html>
